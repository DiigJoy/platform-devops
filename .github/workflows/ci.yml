name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/iot-agri/web/package-lock.json
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv pip install pre-commit
      - name: Install web deps (for next lint hook)
        run: npm ci
        working-directory: apps/iot-agri/web
      - name: Run pre-commit
        run: pre-commit run --all-files

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/iot-agri/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import check
        run: |
          python -c "from app.main import app; print('api import ok')"
      - name: Basic settings check
        run: |
          python -c "from app.settings import settings; print(settings.version)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/iot-agri/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/iot-agri/web/package-lock.json
      - name: Install
        run: |
          npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
