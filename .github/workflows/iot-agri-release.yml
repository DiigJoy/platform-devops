name: iot-agri release tag

on:
  push:
    branches:
      - main
    paths:
      - "apps/iot-agri/**"
      - ".github/workflows/iot-agri-release.yml"
      - "scripts/iot-agri-release.sh"

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag for iot-agri
        run: bash scripts/iot-agri-release.sh
