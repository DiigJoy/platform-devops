name: iot-agri release tag

on:
  push:
    branches:
      - main
    paths:
      - "apps/iot-agri/**"
      - ".github/workflows/iot-agri-release.yml"
      - "scripts/iot-agri-release.sh"

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag for iot-agri
        run: bash scripts/iot-agri-release.sh
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate iot-agri changelog
        run: git-cliff -c apps/iot-agri/cliff.toml -o apps/iot-agri/CHANGELOG.md
      - name: Commit changelog if changed
        run: |
          if git status --porcelain apps/iot-agri/CHANGELOG.md | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/iot-agri/CHANGELOG.md
            git commit -m "chore(iot-agri): update changelog [skip ci]"
            git push origin HEAD:main
          else
            echo "No changelog changes; skipping commit."
          fi
