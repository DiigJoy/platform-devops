name: iot-agri release tag

on:
  push:
    branches:
      - main
    paths:
      - "apps/iot-agri/**"
      - ".github/workflows/iot-agri-release.yml"
      - "scripts/iot-agri-release.sh"

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest tag (before)
        id: before_tag
        run: echo "tag=$(git tag --list 'iot-agri-v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Create release tag for iot-agri
        run: bash scripts/iot-agri-release.sh
      - name: Capture latest tag (after)
        id: after_tag
        run: echo "tag=$(git tag --list 'iot-agri-v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
        if: steps.after_tag.outputs.tag != steps.before_tag.outputs.tag && steps.after_tag.outputs.tag != ''
      - name: Generate iot-agri changelog
        run: git-cliff -c apps/iot-agri/cliff.toml -o apps/iot-agri/CHANGELOG.md
        if: steps.after_tag.outputs.tag != steps.before_tag.outputs.tag && steps.after_tag.outputs.tag != ''
      - name: Normalize changelog line endings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/iot-agri/CHANGELOG.md")
          text = path.read_text()
          text = text.replace("\r\n", "\n")
          lines = text.split("\n")
          while lines and lines[-1] == "":
            lines.pop()
          path.write_text("\n".join(lines) + "\n")
          PY
        if: steps.after_tag.outputs.tag != steps.before_tag.outputs.tag && steps.after_tag.outputs.tag != ''
      - name: Open changelog PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REPO_BOT_TOKEN }}
          commit-message: "chore(iot-agri): update changelog for ${{ steps.after_tag.outputs.tag }}"
          title: "chore(iot-agri): update changelog for ${{ steps.after_tag.outputs.tag }}"
          body: "Automated changelog update for ${{ steps.after_tag.outputs.tag }}."
          branch: "changelog/${{ steps.after_tag.outputs.tag }}"
          delete-branch: true
          add-paths: "apps/iot-agri/CHANGELOG.md"
        if: steps.after_tag.outputs.tag != steps.before_tag.outputs.tag && steps.after_tag.outputs.tag != ''
