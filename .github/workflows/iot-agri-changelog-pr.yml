name: iot-agri changelog (PR)

on:
  pull_request:
    paths:
      - "apps/iot-agri/**"
      - ".github/workflows/iot-agri-changelog-pr.yml"
      - "scripts/iot-agri-release.sh"
      - "apps/iot-agri/cliff.toml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_BOT_TOKEN }}
          ref: ${{ github.head_ref }}
      - name: Read last commit message
        id: last_commit
        run: echo "message=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
        if: ${{ steps.last_commit.outputs.message != 'chore(iot-agri): update changelog' }}
      - name: Generate iot-agri changelog
        run: git-cliff -c apps/iot-agri/cliff.toml -o apps/iot-agri/CHANGELOG.md
        if: ${{ steps.last_commit.outputs.message != 'chore(iot-agri): update changelog' }}
      - name: Commit changelog if changed
        run: |
          if git status --porcelain apps/iot-agri/CHANGELOG.md | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/iot-agri/CHANGELOG.md
            git commit -m "chore(iot-agri): update changelog"
            git push "https://x-access-token:${{ secrets.REPO_BOT_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.head_ref }}
          else
            echo "No changelog changes; skipping commit."
          fi
        if: ${{ steps.last_commit.outputs.message != 'chore(iot-agri): update changelog' }}
